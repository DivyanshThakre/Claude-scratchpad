<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Divyansh Thakre</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f4f0;
      color: #1a1a1a;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      text-align: center;
      max-width: 560px;
      padding: 2rem;
    }
    h1 {
      font-size: 3.2rem;
      font-weight: 700;
      letter-spacing: -1px;
      margin-bottom: 0.5rem;
    }
    .role {
      font-size: 1rem;
      font-weight: 500;
      color: #666;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }
    .divider {
      width: 40px;
      height: 2px;
      background: #1a1a1a;
      margin: 0 auto 1.5rem;
      opacity: 0.15;
    }
    .bio {
      font-size: 1.05rem;
      color: #444;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Divyansh Thakre</h1>
    <p class="role">AI Systems Builder &nbsp;·&nbsp; Product &amp; Growth Enthusiast</p>
    <div class="divider"></div>
    <p class="bio">I enjoy understanding complex systems from first principles and building simple products powered by deep technology.</p>
  </div>
</body>
</html>
